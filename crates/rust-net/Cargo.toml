[package]
name = "rust-net"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_net"
crate-type = ["lib", "staticlib"]

[features]
log = ["dep:log"]
default = ["log"]

[dependencies]
flume = { version = "0.12.0", default-features = false, features = ["async"] }
log = { version = "0.4.34", optional = true }
mio = { version = "1.2.4", features = ["os-poll", "net"] }
prost = "0.14.4"
rand = "0.10.2"
tokio = { version = "1.53.1", features = ["net", "time"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14.6"
cbindgen = "0.29"

